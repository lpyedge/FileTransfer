name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FileTransfer version
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: Remove credentials, internal hostnames, and sensitive paths.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and internal paths.
      render: text
